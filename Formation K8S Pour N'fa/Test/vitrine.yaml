apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
  namespace: vitrine
spec:
  replicas: 3

  #EX-05 : stratégie de mise à jour
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: vitrine
      tier: front

  template:
    metadata:
      labels:
        app: vitrine
        tier: front

    spec:
      #EX-06 : initContainer
      initContainers:
        - name: attente
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo 'Initialisation...'; sleep 5"

      containers:
        - name: nginx
          image: nginx:1.27

          #EX-02 : Resources
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          #EX-03 : Readiness
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          
          #EX-04 : Liveness    
          livenessProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 3
