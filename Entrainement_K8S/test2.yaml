apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web          # le RS adopte les pods portant ce label
  template:             # le moule a pods
    metadata:
      labels:
        app: web        # DOIT correspondre au selector ci-dessus
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
