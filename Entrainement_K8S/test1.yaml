apiVersion: v1
kind: Pod
metadata:
  name: app-complet
  labels: { app: demo }
spec:
  initContainers:
  - name: preparation
    image: busybox:1.36
    command: ['sh','-c','echo "Prepa..." && sleep 5']
  containers:
  - name: web
    image: nginx:1.25
    ports: [{ containerPort: 80 }]
    readinessProbe:
      httpGet: { path: /, port: 80 }
      initialDelaySeconds: 3
    resources:
      requests: { memory: "64Mi", cpu: "100m" }
      limits:   { memory: "128Mi", cpu: "200m" }
